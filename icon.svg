<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- تدريج الخلفية الملكي -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c222b"/>
      <stop offset="100%" stop-color="#040b0e"/>
    </linearGradient>
    <!-- تدريج ذهبي هندسي -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- تدريج زمردي مساحي -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- خلفية الأيقونة (إطار دائري منحني الزوايا) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#164e63" stroke-width="6"/>

  <!-- شبكة كاد خلفية خفيفة -->
  <path d="M 0 128 H 512 M 0 256 H 512 M 0 384 H 512 M 128 0 V 512 M 256 0 V 512 M 384 0 V 512" stroke="#10b981" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- مضلع هندسي مساحي في المنتصف -->
  <polygon points="256,90 410,210 350,390 162,390 102,210" fill="url(#emeraldGrad)" fill-opacity="0.18" stroke="url(#emeraldGrad)" stroke-width="5" stroke-dasharray="10 6"/>

  <!-- بوصلة وسهم الشمال الهندسي -->
  <g transform="translate(256, 235)" filter="url(#glow)">
    <!-- الدائرة الخارجية للبوصلة -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- سهم الشمال المزدوج -->
    <polygon points="0,-80 -18,25 0,10" fill="url(#goldGrad)"/>
    <polygon points="0,-80 18,25 0,10" fill="#f59e0b" fill-opacity="0.7"/>
    <polygon points="0,80 -18,-25 0,-10" fill="#10b981" fill-opacity="0.85"/>
    <polygon points="0,80 18,-25 0,-10" fill="#059669"/>
    <circle cx="0" cy="0" r="10" fill="#0c222b" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- حرف N للشمال -->
    <text x="0" y="-95" fill="#fbbf24" font-family="Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle">N</text>
  </g>

  <!-- شريط العنوان السفلي مع اسم التطبيق وم. أحمد سمير -->
  <g transform="translate(256, 435)">
    <rect x="-210" y="-22" width="420" height="48" rx="10" fill="#061318" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="8" fill="#f0fdf4" font-family="'Cairo', Arial, sans-serif" font-weight="800" font-size="20" text-anchor="middle">المسّاح الرقمي PRO</text>
  </g>
</svg>
